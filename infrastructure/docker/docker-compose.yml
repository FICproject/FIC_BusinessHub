version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fic-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fic_business_hub
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: fic-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: fic-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fic_business_hub
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: fic-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: fic-admin
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:

